	<script>
		var trendingSwiper = new Swiper('.myTrendingSwiper', {
			slidesPerView: "auto",
			spaceBetween: 15,
			loop: false,
			touchRatio: 0.7,     // độ nhạy vừa phải
  			longSwipesRatio: 0.6,// phải kéo 60% slide mới nhảy
			watchOverflow: true, // ✅ auto disable nếu không cần scroll
			navigation: {
				nextEl: '.swiper-button-next',
				prevEl: '.swiper-button-prev',
			},
			pagination: {
				el: '.swiper-pagination',
				clickable: true,
			},
			breakpoints: {
				500: { slidesPerView: 1 },
				600: { slidesPerView: 2 },
				900: { slidesPerView: 3 },
				1200: { slidesPerView: 4 }
			},
			slidesPerGroup: 1,
			longSwipes: false,
			// Add this line:
			slidesPerGroupSkip: 0,
			// And this line to prevent blank at the end:
			centeredSlides: false,
		});
	</script>
